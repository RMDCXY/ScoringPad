<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ScoringPad</title>
  <link rel="stylesheet" href="style.css" />
  <!-- 引入 html2canvas 用于截屏 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <!-- 深浅色切换与搜索按钮（通用） -->
  <button id="more-toggle" class="theme-toggle">➕</button>
  <button id="search-toggle" class="theme-toggle">🔍</button>
  <button id="class-toggle" class="theme-toggle">🏫</button>
  <button id="theme-toggle" class="theme-toggle"></button>
  
  <!-- 管理页面 -->
  <div id="dashboard-page" class="page hidden">
    <h1>ScoringPad</h1>

    <div id="notice-box" class="notice">
      <button class="dismiss-notice-btn" id="dismiss-notice" type="button">不再提示</button>
      <span class="close-btn" id="close-notice">&times;</span>
      ✨欢迎使用ScoringPad记分模板！🎉<br />
      ⚠️由于技术限制原因，记分使用本地存储，不存储在云端，所以请千万不要清理浏览器数据！千万不要清理浏览器数据！否则计分数据会被全部清空！！！<br />
      ⓘ如果您在更换设备时需要同步数据，可以通过下方的“导入/导出CSV”选项保存记分数据为文件，并在多设备间发送以实现数据同步。<br />
      😄现在，点击右上角更多菜单，立即添加学生开始使用您的ScoringPad吧！
    </div>

    <button id="leaderboard-btn" class="btn-yellow">🏆排行榜</button>

    <div id="students-list"></div>
  </div>

  <!-- 排行榜页面 -->
  <div id="leaderboard-page" class="page hidden">
    <div class="leaderboard-header">
      <button id="back-btn" class="btn-blue">← 返回</button>
      <button id="screenshot-btn" class="btn-purple">📷 截屏</button>
    </div>
    <h1>🏆 排行榜</h1>
    <div id="ranked-list"></div>
  </div>

  <!-- 随机抽选页面 -->
  <div id="random-pick-page" class="page hidden">
    <div class="leaderboard-header">
      <button id="random-pick-back-btn" class="btn-blue">← 返回</button>
    </div>
    <h1>🎲 随机抽选</h1>
    <div class="random-pick-controls">
      <div class="pick-count-selector" aria-label="抽选人数">
        <button id="pick-count-decrease" type="button" aria-label="减少抽选人数">−</button>
        <output id="pick-count" for="pick-count-decrease pick-count-increase">1</output>
        <button id="pick-count-increase" type="button" aria-label="增加抽选人数">+</button>
      </div>
      <label class="advanced-pick-toggle">
        <input id="advanced-pick" type="checkbox" />
        <span>高级抽选</span>
      </label>
      <div id="pick-student-list" class="pick-student-list hidden"></div>
      <button id="start-random-pick" class="btn-yellow" type="button">开始抽选</button>
      <div id="random-pick-result" class="random-pick-result hidden" aria-live="polite"><span id="random-pick-result-text"></span></div>
    </div>
  </div>

  <!-- 隐藏的文件输入用于导入 -->
  <input type="file" id="file-input" accept=".csv" style="display:none" />

  <script src="script.js"></script>
</body>
</html>
